<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Django Basic Example</title>
</head>
<body>
  <!-- {{ variable }} is Django Template Language interpolation. -->
  <h1>{{ message }}</h1>
  <p>This page was rendered on the server using {{ framework }}.</p>
  <!-- The browser receives ordinary HTML after Django renders this template. -->
</body>
</html>
